<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>BorrowLoop · Borrow it, don't buy it</title>
<meta name="description" content="BorrowLoop: borrow tents, tools, cameras and party gear from your neighbours instead of buying them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="homepage.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="#/" class="logo" aria-label="BorrowLoop home">
      <span class="logo-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h8a4 4 0 0 1 0 8H9"/><path d="M10 12 7 15l3 3"/></svg></span>
      <span class="logo-text">BorrowLoop</span>
    </a>

    <button class="loc-chip" id="locBtn" type="button" aria-label="Change your location">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="locLabel">Subang Jaya</span>
    </button>

    <form class="nav-search" id="navSearchForm" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <label class="sr" for="navSearch">Search items</label>
      <input id="navSearch" type="search" placeholder="Search tents, drills, cameras…" autocomplete="off">
    </form>

    <nav class="nav-links" aria-label="Main">
      <a href="#/" data-view="home" title="Home" aria-label="Home"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span class="lbl">Home</span></a>
      <a href="#/search" data-view="search" title="Search" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="lbl">Search</span></a>
      <a href="#/rentals" data-view="rentals" title="My rentals" aria-label="My rentals"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span class="lbl">My rentals</span></a>

    </nav>

    <a href="#/search" class="icon-btn mobile-search" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
    <div class="nav-icons">
      <a href="#/messages" class="icon-btn has-badge" id="msgBtn" aria-label="Messages"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="badge" id="msgBadge" hidden></span></a>
      <button class="icon-btn has-badge" id="bellBtn" type="button" aria-label="Notifications"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span class="badge" id="bellBadge" hidden></span></button>

          <div class="um-head" id="umHead"></div>
          <a href="#/profile" role="menuitem">My profile</a>
          <a href="#/rentals" role="menuitem">My rentals</a>
          <a href="#/messages" role="menuitem">Messages</a>
          <a href="#/wallet" role="menuitem">Wallet</a>
          <a href="#/settings" role="menuitem">Settings</a>
          <a href="#/help" role="menuitem">Help centre</a>
        </div>
      </div>
      <a href="#/login" class="btn btn-primary btn-signin" id="signInBtn" hidden>Sign in</a>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap foot">
    <div>
      <div class="logo" style="font-size:18px;color:var(--ink)">BorrowLoop</div>
      <p style="margin-top:6px">Borrow it, don't buy it. Made for neighbours in Malaysia.</p>
    </div>
    <div class="foot-links">
      <a href="#/">Home</a>
      <a href="#/search">Search</a>
      <a href="#/list">Lend your stuff</a>
      <a href="#how">How it works</a>
      <a href="#safety">Safety</a>
      <a href="#/messages">Messages</a>
      <a href="#/wallet">Wallet</a>
      <a href="#/settings">Settings</a>
      <a href="#/help">Help centre</a>
    </div>
  </div>
</footer>

<nav class="tabbar" aria-label="Mobile menu">
  <a href="#/" data-view="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
  <a href="#/search" data-view="search"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search</a>
  <a href="#/list" data-view="list" class="tab-add" aria-label="List an item"><span><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span></a>
  <a href="#/rentals" data-view="rentals"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Rentals</a>
  <a href="#/profile" data-view="profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Profile</a>
</nav>
